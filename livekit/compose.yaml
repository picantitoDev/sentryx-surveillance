services:
  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:?Define LIVEKIT_VERSION en livekit/.env}
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "${TAILSCALE_IP:?Define TAILSCALE_IP en livekit/.env}:7881:7881/tcp"
      - "${TAILSCALE_IP:?Define TAILSCALE_IP en livekit/.env}:7882:7882/udp"
    restart: unless-stopped

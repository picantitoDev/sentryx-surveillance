[pytest]
testpaths = tests
pythonpath = .
addopts = --import-mode=importlib --strict-markers
markers =
    unit: Reglas de dominio y casos de uso con dobles en memoria.
    black_box: Contratos HTTP, validacion y seguridad de la API.
    integration: Integracion entre adaptadores y componentes del backend.
    e2e: Flujos completos por HTTP contra un proceso aislado.
    postgres: Requiere SENTRIX_TEST_DATABASE_URL y usa un esquema temporal.
